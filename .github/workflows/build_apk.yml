name: Build Foto S25 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub non apre gli zip: se nel repository c'è uno zip
      # con il progetto, lo estrae qui prima di compilare
      - name: Estrai lo zip del progetto
        run: |
          shopt -s nullglob
          for Z in *.zip; do
            echo "Estraggo $Z"
            unzip -o -q "$Z" -d estratto
          done

      # Trova da solo la cartella del progetto, anche se i file
      # sono dentro una sottocartella (es. Foto-s25/)
      - name: Trova il progetto
        run: |
          echo "Contenuto del repository:"
          find . -path ./.git -prune -o -type f -print | sort
          # Prima cerca nello zip estratto (versione corretta), poi nel resto
          SETTINGS=""
          if [ -d estratto ]; then
            SETTINGS=$(find estratto -name 'settings.gradle*' | head -n 1)
          fi
          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find . -path ./.git -prune -o -name 'settings.gradle*' -print | head -n 1)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "ERRORE: settings.gradle.kts non trovato nel repository"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Progetto trovato in: $DIR"
          echo "PROGETTO=$DIR" >> "$GITHUB_ENV"

      - name: Compila APK release
        run: |
          cd "$PROGETTO"
          gradle assembleRelease --no-daemon

      - name: Carica APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: Foto-S25-release
          path: ${{ env.PROGETTO }}/app/build/outputs/apk/release/app-release.apk
